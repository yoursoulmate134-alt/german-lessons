
name: Build German Lessons APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: unzip -o GermanLessonsAndroidProject.zip -d extracted

      - name: Fix Java target version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("extracted/GermanLessons/app/build.gradle.kts")
          s = p.read_text()

          block = """compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }"""

          pattern = r"compileOptions\s*\{[^}]*\}"

          if re.search(pattern, s):
              s = re.sub(pattern, lambda _: block, s, count=1)
          else:
              s = re.sub(
                  r"\bandroid\s*\{",
                  "android {\n    " + block,
                  s,
                  count=1
              )

          p.write_text(s)
          PY

      - name: Build APK
        run: gradle -p extracted/GermanLessons assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: german-lessons-apk
          path: extracted/GermanLessons/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

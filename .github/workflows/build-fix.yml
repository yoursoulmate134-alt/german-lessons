
name: Build German Lessons APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
            - name: Align Java and Kotlin versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("extracted/GermanLessons/app/build.gradle.kts")
          s = p.read_text()
          block = """compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }"""
          pattern = r'compileOptions\s*\{[^}]*\}'
          if re.search(pattern, s):
              s = re.sub(pattern, block, s, count=1)
          else:
              s = re.sub(r'\bandroid\s*\{',
                         'android {\n    ' + block,
                         s, count=1)
          p.write_text(s)
          PY
        run: unzip -o GermanLessonsAndroidProject.zip -d extracted

      - name: Build APK
        run: gradle -p extracted/GermanLessons assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: german-lessons-apk
          path: extracted/GermanLessons/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
